[project]
name = "autoprocure-backend"
version = "0.1.0"
description = "Autonomous, policy-enforced procurement agent with PayPal settlement"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "google-genai>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
